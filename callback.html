<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectando Spotify…</title>
<style>
  body{margin:0;background:#0a0a0a;color:#f5f5f5;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
  p{font-size:1rem;line-height:1.6}
</style>
</head>
<body>
<p id="msg">Conectando con Spotify…</p>
<script>
(async function(){
  const msg=document.getElementById('msg');
  const q=new URLSearchParams(location.search);
  const code=q.get('code'), error=q.get('error');
  if(error||!code){ msg.textContent='No se pudo conectar: '+(error||'Spotify no envió el código.'); return; }
  const verifier=sessionStorage.getItem('sp_verifier');
  if(!verifier){ msg.textContent='Faltó el verificador de seguridad. Vuelve a intentarlo desde la app.'; return; }
  try{
    const KEY='uae_dashboard_v2';
    const state=JSON.parse(localStorage.getItem(KEY)||'{}');
    const body=new URLSearchParams({
      grant_type:'authorization_code',
      code:code,
      redirect_uri:'https://alex-uae.github.io/mi-dashboard/callback.html',
      client_id:(state.spotify&&state.spotify.clientId)||'',
      code_verifier:verifier
    });
    const r=await fetch('https://accounts.spotify.com/api/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    state.spotify=Object.assign({},state.spotify,{
      access:d.access_token,
      refresh:d.refresh_token,
      expires:Date.now()+(d.expires_in||3600)*1000,
      track:null
    });
    localStorage.setItem(KEY,JSON.stringify(state));
    sessionStorage.removeItem('sp_verifier');
    location.replace('./');
  }catch(e){ msg.textContent='Error al conectar: '+e.message; }
})();
</script>
</body>
</html>
